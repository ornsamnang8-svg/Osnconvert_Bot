services:
  link2media:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: link2media_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
